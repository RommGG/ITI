<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Bien</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Fondo blanco principal -->
    <div class="container bg-white p-4 mt-5 rounded shadow-sm">
  
      <!-- Encabezado: palabra e imagen dentro del fondo blanco -->
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div>
          <h1 class="text-success m-0">Inventario</h1>
          <p id="nombreUsuario" class="text-muted fs-5 m-0"></p> <!-- Aquí se mostrará el nombre -->
        </div>
        <img src="images/logo.jpg" alt="Logo" style="width: 110px; height: auto;" class="rounded">
      </div>
  
      <h2 class="text-center mb-4 text-secondary">Agregar Bien</h2>
  
      <!-- Tarjeta de formulario -->
      <div class="card border-0">
        <div class="card-body">
          <form id="bienForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="laboratorio" class="form-label">Laboratorio:</label>
                <input type="text" class="form-control" id="laboratorio" required>
              </div>
              <div class="col-md-6">
                <label for="descripcion" class="form-label">Descripción:</label>
                <input type="text" class="form-control" id="descripcion" required>
              </div>
              <div class="col-md-6">
                <label for="marca" class="form-label">Marca:</label>
                <input type="text" class="form-control" id="marca">
              </div>
              <div class="col-md-6">
                <label for="color" class="form-label">Color:</label>
                <input type="text" class="form-control" id="color" required>
              </div>
              <div class="col-md-6">
                <label for="material" class="form-label">Material:</label>
                <input type="text" class="form-control" id="material">
              </div>
              <div class="col-md-6">
                <label for="serie" class="form-label">Serie:</label>
                <input type="text" class="form-control" id="serie">
              </div>
              <div class="col-md-6">
                <label for="estado" class="form-label">Estado:</label>
                <select class="form-select" id="estado" required>
                  <option value="Bueno">Bueno</option>
                  <option value="Regular">Regular</option>
                  <option value="Malo">Malo</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="observaciones" class="form-label">Observaciones:</label>
                <input type="text" class="form-control" id="observaciones">
              </div>
              <div class="col-md-12">
                <label for="usuario_responsable" class="form-label">Usuario Responsable:</label>
                <input type="text" class="form-control" id="usuario_responsable" required>
              </div>
              <div class="col-md-6">
                <label for="no_etiqueta" class="form-label">No. Etiqueta:</label>
                <input type="text" class="form-control" id="no_etiqueta" required>
              </div>
              <div class="col-md-6">
                <label for="fecha" class="form-label">Fecha del bien:</label>
                <input type="date" class="form-control" id="fecha" required>
              </div>

              <div class="col-md-6">
                <label for="movimiento" class="form-label">Movimiento:</label>
                <select class="form-select" id="movimiento" required>
                  <option value="NA">NA</option>
                  <option value="Traspaso">Traspaso</option>
                  <option value="Rotacion">Rotacion</option>
                  <option value="Baja">Baja</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="area_origen" class="form-label">Área Origen (opcional):</label>
                <input type="text" class="form-control" id="area_origen">
              </div>

              <div class="col-md-6">
                <label for="area_destino" class="form-label">Área Destino (opcional):</label>
                <input type="text" class="form-control" id="area_destino">
              </div>

              <div class="col-md-6">
                <label for="fecha_movimiento" class="form-label">Fecha del movimiento:</label>
                <input type="date" class="form-control" id="fecha_movimiento" >
              </div>

              <div class="col-md-6">
                <label for="autorizo" class="form-label">Autorizó (opcional):</label>
                <input type="text" class="form-control" id="autorizo">
              </div>


            </div>
  
            <button type="submit" class="btn btn-success w-100 mt-4">Agregar Bien</button>
  
            <div class="mt-3 text-center">
              <a href="administracion.html" class="btn btn-outline-primary">Ver bienes</a>
            </div>
                        <!-- Mensaje flotante al centro, más grande -->
            <div id="mensajeExito" class="position-fixed top-50 start-50 translate-middle bg-success text-white px-5 py-4 rounded shadow-lg fs-4 fw-bold d-none text-center" style="z-index: 1050;">
              ✅ Bien agregado correctamente
            </div>

          </form>
        </div>
      </div>
    </div>
  

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBqLeHhOIlDrHCDqovuvmX5fEQIDccC_UI",
            authDomain: "inventario-login-4137e.firebaseapp.com",
            projectId: "inventario-login-4137e",
            storageBucket: "inventario-login-4137e.firebasestorage.app",
            messagingSenderId: "695847381869",
            appId: "1:695847381869:web:33401d4af8b3237842c864",
            measurementId: "G-NVS9QSLHNH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById("bienForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const nuevoBien = {
                laboratorio: document.getElementById("laboratorio").value,
                descripcion: document.getElementById("descripcion").value,
                marca: document.getElementById("marca").value || null,
                color: document.getElementById("color").value,
                material: document.getElementById("material").value || null,
                serie: document.getElementById("serie").value || null,
                estado: document.getElementById("estado").value,
                observaciones: document.getElementById("observaciones").value || null,
                usuario_responsable: document.getElementById("usuario_responsable").value,
                no_etiqueta: document.getElementById("no_etiqueta").value,
                fecha: document.getElementById("fecha").value,
                movimiento: document.getElementById("movimiento").value,
                area_origen: document.getElementById("area_origen").value || null,
                area_destino: document.getElementById("area_destino").value || null,
                fecha_movimiento: document.getElementById("fecha_movimiento").value || null,
                autorizo: document.getElementById("autorizo").value || null,
               
            };

              try {
                    await addDoc(collection(db, "mobiliario"), nuevoBien);
                    document.getElementById("bienForm").reset();

                    const mensajeExito = document.getElementById("mensajeExito");
                    mensajeExito.classList.remove("d-none");

                    // Oculta el mensaje después de 2 segundos
                    setTimeout(() => {
                        mensajeExito.classList.add("d-none");
                    }, 2000);

                    // Limpia también el mensaje de error si hubiera alguno
                    document.getElementById("mensaje").innerHTML = "";
                    } catch (error) {
                        console.error("Error al agregar bien:", error);
                        document.getElementById("mensaje").innerHTML = "<span class='text-danger'>Error al agregar bien.</span>";
                    }

              });
              const usuarioGuardado = JSON.parse(localStorage.getItem("user"));
const nombreUsuario = usuarioGuardado?.nombre || "Usuario";
document.getElementById("nombreUsuario").textContent = `Bienvenido, ${nombreUsuario}`;


    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
