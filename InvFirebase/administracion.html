<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bienes Asignados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light text-dark">

  <div class="position-relative">
    <div class="position-absolute top-0 start-0 p-3">
      <h1 class="text-success fw-bold fs-3 m-0">Inventario de bienes TI</h1>
    </div>
    <div class="position-absolute top-0 end-0 p-3">
      <img src="images/logo.jpg" alt="Logo de ejemplo"
        style="width: 60px; height: 60px; object-fit: contain; border-radius: 10px;">
    </div>
  </div>
<br><br>
  <div class="container-fluid px-4 py-4">
    <h2 class="text-center mb-4">Bienes Asignados</h2>

    <div class="mb-3 text-center">
      <input type="text" id="searchInput" class="form-control w-75 mx-auto" placeholder="Busca alguna coincidencia...">
    </div>

    <div class="d-flex justify-content-between mb-3">
      <a href="administrarUsuarios.html" class="btn btn-success">Administrar usuarios</a>
      <a href="agregarBienes.html" class="btn btn-warning">Agregar bienes</a>
      <button id="cerrarSesionBtn" class="btn btn-danger">Cerrar Sesión</button>
    </div>

    <div class="mb-3 text-center">
      <label for="sortField" class="form-label">Ordenar por (orden ascendente):</label>
      <select id="sortField" class="form-select w-50 mx-auto">
        <option value="">Selecciona un campo</option>
        <option value="laboratorio">Laboratorio</option>
        <option value="area">Área</option>
        <option value="fecha">Fecha</option>
        <option value="marca">Marca</option>
        <option value="usuario_responsable">Usuario Responsable</option>
      </select>
    </div>


    <div class="table-responsive" style="overflow-x: auto; max-height: 70vh;">

      <table class="table table-bordered table-hover align-middle text-center">
        <thead class="table-success">
          <tr>
            <th>Lab</th>
            <th>Desc.</th>
            <th>Marca</th>
            <th>Color</th>
            <th>Material</th>
            <th>Serie</th>
            <th>Estado</th>
            <th>Obs.</th>
            <th>U. Responsable</th>
            <th>N. Etiq.</th>
            <th>F. del bien</th>
            <th style="color: rgb(7, 177, 35);">Movimiento</th>
            <th style="color: rgb(7, 177, 35);">Área origen</th>
            <th style="color: rgb(7, 177, 35);;">Área destino</th>
            <th style="color: rgb(7, 177, 35);;">F. Movimiento</th>
            <th style="color: rgb(7, 177, 35);;">Autorizo Mov.</th>
            <th>Acciones</th>
          </tr>
        </thead>



        <tbody id="bienesTable">
          <tr>
            <td colspan="17">Cargando...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="editModal" class="modal"
    style="position: fixed; z-index: 1050; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center;">
    <div
      style="background-color: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative;">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="modal-title">Editar Bien</h5>
        <span class="close fs-4" onclick="cerrarModal()" style="cursor:pointer;">&times;</span>
      </div>
      <form id="editForm">
        <input type="hidden" id="editId">
        <div class="mb-2"><label>Laboratorio:</label><input type="text" class="form-control" id="editLaboratorio"></div>
        <div class="mb-2"><label>Descripción:</label><input type="text" class="form-control" id="editDescripcion"></div>
        <div class="mb-2"><label>Marca:</label><input type="text" class="form-control" id="editMarca"></div>
        <div class="mb-2"><label>Color:</label><input type="text" class="form-control" id="editColor"></div>
        <div class="mb-2"><label>Material:</label><input type="text" class="form-control" id="editMaterial"></div>
        <div class="mb-2"><label>Serie:</label><input type="text" class="form-control" id="editSerie"></div>
        <div class="mb-2"><label>Estado:</label>
          <select class="form-select" id="editEstado" required>
            <option value="Bueno">Bueno</option>
            <option value="Regular">Regular</option>
            <option value="Malo">Malo</option>
          </select>
        </div>
        <div class="mb-2"><label>Observaciones:</label><input type="text" class="form-control" id="editObservaciones">
        </div>
        <div class="mb-2"><label>Usuario Responsable:</label><input type="text" class="form-control"
            id="editUsuarioResponsable"></div>
        <div class="mb-2"><label>No. Etiqueta:</label><input type="text" class="form-control" id="editNoEtiqueta"></div>
        <div class="mb-2"><label>Fecha del bien:</label><input type="date" class="form-control" id="editFecha"></div>
        <div class="mb-2"><label>Movimiento (opcional):</label><select class="form-select" id="editMovimiento" required>
            <option value="NA">NA</option>
            <option value="Traspaso">Traspaso</option>
            <option value="Rotacion">Rotacion</option>
            <option value="Baja">Baja</option>
          </select></div>
        <div class="mb-2"><label>Área de origen del movimiento (opcional):</label><input type="text"
            class="form-control" id="editAreaOrigen"></div>
        <div class="mb-2"><label>Área destino del movimiento (opcional):</label><input type="text" class="form-control"
            id="editAreaDestino"></div>
        <div class="mb-2"><label>Fecha del movimiento (opcional):</label><input type="date" class="form-control"
            id="editFechaMovimiento"></div>
        <div class="mb-2"><label>Autorizó el movimiento (opcional):</label><input type="text" class="form-control"
            id="editAutorizo">
        </div>
        <div class="text-end mt-3">
          <button type="button" class="btn btn-primary" onclick="guardarCambios()">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Script actualizado -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBqLeHhOIlDrHCDqovuvmX5fEQIDccC_UI",
      authDomain: "inventario-login-4137e.firebaseapp.com",
      projectId: "inventario-login-4137e",
      storageBucket: "inventario-login-4137e.appspot.com",
      messagingSenderId: "695847381869",
      appId: "1:695847381869:web:33401d4af8b3237842c864",
      measurementId: "G-NVS9QSLHNH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function obtenerBienes() {
      try {
        const mobiliarioRef = collection(db, "mobiliario");
        const querySnapshot = await getDocs(mobiliarioRef);
        let bienesArray = [];

        querySnapshot.forEach(docSnap => {
          const bien = docSnap.data();
          bienesArray.push({ id: docSnap.id, ...bien });
        });

        const campoOrden = document.getElementById("sortField").value;
        if (campoOrden) {
          bienesArray.sort((a, b) => {
            const valorA = (a[campoOrden] || "").toString().toLowerCase();
            const valorB = (b[campoOrden] || "").toString().toLowerCase();
            return valorA.localeCompare(valorB);
          });
        }

        let bienesHTML = "";
        bienesArray.forEach(bien => {
          bienesHTML += `
      <tr>
        <tr>
                <td>${bien.laboratorio || "N/A"}</td>
                <td>${bien.descripcion || "N/A"}</td>
                <td>${bien.marca || "N/A"}</td>
                <td>${bien.color || "N/A"}</td>
                <td>${bien.material || "N/A"}</td>
                <td>${bien.serie || "N/A"}</td>
                <td>${bien.estado || "N/A"}</td>
                <td>${bien.observaciones || "N/A"}</td>
                <td>${bien.usuario_responsable || "N/A"}</td>
                <td>${bien.no_etiqueta || "N/A"}</td>
                <td>${bien.fecha || "N/A"}</td>
                 <td style="color: red">${bien.movimiento || "N/A"}</td>
                 <td style="color: red">${bien.areaOrigen || "N/A"}</td>
                <td style="color: red">${bien.areaDestino || "N/A"}</td>
                <td style="color: red">${bien.fecha_movimiento || "N/A"}</td>
                <td style="color: red">${bien.autorizo || "N/A"}</td>

             
        
        <td>
          <button class="btn btn-warning btn-sm" onclick='abrirModal(${JSON.stringify(bien)})'>Editar</button>
          <button class="btn btn-danger btn-sm" onclick='eliminarBien("${bien.id}")'>Eliminar</button>
        </td>
      </tr>
    `;
        });

        document.getElementById("bienesTable").innerHTML = bienesHTML;
        agregarBusqueda();
      } catch (error) {
        console.error("Error obteniendo bienes:", error);
      }
    }


    document.getElementById("sortField").addEventListener("change", obtenerBienes);


    window.eliminarBien = async function (id) {
      const confirmar = confirm("¿Estás seguro de que deseas eliminar este bien?");
      if (!confirmar) return;

      try {
        const ref = doc(db, "mobiliario", id);
        await deleteDoc(ref);
        alert("Bien eliminado correctamente.");
        obtenerBienes(); // Refresca la tabla
      } catch (error) {
        console.error("Error al eliminar el bien:", error);
        alert("No se pudo eliminar el bien. Verifica la consola.");
      }
    };


    window.abrirModal = function (bien) {
      document.getElementById("editId").value = bien.id;
      document.getElementById("editLaboratorio").value = bien.laboratorio || "";
      document.getElementById("editDescripcion").value = bien.descripcion || "";
      document.getElementById("editMarca").value = bien.marca || "";
      document.getElementById("editColor").value = bien.color || "";
      document.getElementById("editMaterial").value = bien.material || "";
      document.getElementById("editSerie").value = bien.serie || "";
      document.getElementById("editEstado").value = bien.estado || "";
      document.getElementById("editObservaciones").value = bien.observaciones || "";
      document.getElementById("editUsuarioResponsable").value = bien.usuario_responsable || "";
      document.getElementById("editNoEtiqueta").value = bien.no_etiqueta || "";
      document.getElementById("editFecha").value = bien.fecha || "";
      document.getElementById("editMovimiento").value = bien.movimiento || "";
      document.getElementById("editAreaOrigen").value = bien.area_origen || "";
      document.getElementById("editAreaDestino").value = bien.area_destino || "";
      document.getElementById("editFechaMovimiento").value = bien.fecha_traspaso || "";
      document.getElementById("editAutorizo").value = bien.autorizo || "";
      document.getElementById("editModal").style.display = "flex";
    };

    window.cerrarModal = function () {
      document.getElementById("editModal").style.display = "none";
    };

    window.guardarCambios = async function () {
      const id = document.getElementById("editId").value;
      const ref = doc(db, "mobiliario", id);

      const datosActualizados = {
        laboratorio: document.getElementById("editLaboratorio").value,
        descripcion: document.getElementById("editDescripcion").value,
        marca: document.getElementById("editMarca").value,
        color: document.getElementById("editColor").value,
        material: document.getElementById("editMaterial").value,
        serie: document.getElementById("editSerie").value,
        estado: document.getElementById("editEstado").value,
        observaciones: document.getElementById("editObservaciones").value,
        usuario_responsable: document.getElementById("editUsuarioResponsable").value,
        no_etiqueta: document.getElementById("editNoEtiqueta").value,
        fecha: document.getElementById("editFecha").value,
        movimiento: document.getElementById("editMovimiento").value,
        area_origen: document.getElementById("editAreaOrigen").value,
        area_destino: document.getElementById("editAreaDestino").value,
        fecha_movimiento: document.getElementById("editFechaMovimiento").value,
        autorizo: document.getElementById("editAutorizo").value,
      };

      try {
        await updateDoc(ref, datosActualizados);
        alert("Bien actualizado correctamente.");
        cerrarModal();
        obtenerBienes(); // Refresca la tabla
      } catch (error) {
        console.error("Error actualizando bien:", error);
        alert("Error al actualizar. Verifica la consola.");
      }
    };

    function agregarBusqueda() {
      const input = document.getElementById("searchInput");
      input.addEventListener("input", () => {
        const filtro = input.value.toLowerCase();
        const filas = document.querySelectorAll("#bienesTable tr");
        filas.forEach(fila => {
          const celdas = fila.getElementsByTagName("td");
          let encontrado = false;
          for (let i = 0; i < celdas.length - 1; i++) {
            if (celdas[i].textContent.toLowerCase().includes(filtro)) {
              encontrado = true;
              break;
            }
          }
          fila.style.display = encontrado ? "" : "none";
        });
      });
    }

    document.getElementById("cerrarSesionBtn").addEventListener("click", function () {
      // Eliminar datos del usuario guardados
      localStorage.removeItem("user")

      // Redirigir al login
      window.location.href = "login.html";
    });

    obtenerBienes();
  </script>
